name: Test & Deploy

on:
    push:
        tags:
            - "*"
        branches:
            - master
    workflow_dispatch:

jobs:
    build-and-upload:
        strategy:
            fail-fast: false
            matrix:
                # Build prebuilt binaries for Node 22 (LTS) and 24 (current) across platforms
                node-version: [22, 24]
                runner: [ubuntu-22.04, ubuntu-24.04-arm, macos-14]
        runs-on: ${{ matrix.runner }}
        steps:
            # Checkout with submodules to pull in vendored libxml2 source
            - uses: actions/checkout@v6
              with:
                  persist-credentials: false
                  submodules: true

            # Python is required by node-gyp to compile native C++ addons
            - uses: actions/setup-python@v6
              with:
                  python-version: "3.12"

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: "npm"

            # Read version from package.json
            - name: Get package version
              id: package
              run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

            # Validate tag matches package version
            - name: Validate tag version
              run: |
                TAG_VERSION="${{ github.ref_name }}"
                PACKAGE_VERSION="${{ steps.package.outputs.version }}"
                echo "Tag version: $TAG_VERSION"
                echo "Package version: $PACKAGE_VERSION"
                if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
                  echo "❌ Error: Tag '$TAG_VERSION' does not match package version '$PACKAGE_VERSION'"
                  echo "❌ Tag must exactly match package version: '$PACKAGE_VERSION'"
                  exit 1
                fi
                echo "✅ Tag version matches package version"

            # Install deps and compile native libxml2 bindings from source
            - run: npm ci --build-from-source

            # Package the compiled binary into a tarball for distribution via node-pre-gyp
            - run: npm run package 2>&1

            # Verify TypeScript compiles cleanly
            - run: npm run tsc

            # Run the full test suite (node:test via tsx)
            - run: npm run test

            # Create GitHub release before uploading assets
            - name: Create GitHub Release
              uses: softprops/action-gh-release@v1
              with:
                  name: Release ${{ steps.package.outputs.version }}
                  body: |
                    Prebuilt binaries for @jhulford/libxmljs version ${{ steps.package.outputs.version }}

                    ## Installation
                    ```bash
                    npm install @jhulford/libxmljs@${{ steps.package.outputs.version }}
                    ```

                    ## Supported Platforms
                    - Linux x64 (Node 22, 24)
                    - Linux arm64 (Node 22, 24)
                    - macOS arm64 (Node 22, 24)
                  draft: false
                  prerelease: ${{ contains(steps.package.outputs.version, 'alpha') || contains(steps.package.outputs.version, 'beta') || contains(steps.package.outputs.version, 'rc') }}
              env:
                  GITHUB_TOKEN: ${{ github.token }}

            # Upload the prebuilt binary tarball to the GitHub release
            - name: Upload release binary
              uses: alexellis/upload-assets@0.4.1
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              with:
                  asset_paths: '["./build/stage/jhulford/libxmljs/releases/download/**/*.tar.gz"]'
