name: Test & Deploy

on:
    push:
        tags:
            - "*"
    workflow_dispatch:

jobs:
    upload-linux-x64:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                config:
                    - { node-version: 22 }
                    - { node-version: 24 }
                container-image: [x86_64]
        container:
            image: quay.io/pypa/manylinux_2_28_${{ matrix.container-image }}
            env:
                PATH: /opt/python/cp38-cp38/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            options: --user root
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
                  submodules: true
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - name: Point node-gyp at Python
              run: |
                  echo "PYTHON=${pythonLocation}/bin/python3" >> "$GITHUB_ENV"
                  echo "npm_config_python=${pythonLocation}/bin/python3" >> "$GITHUB_ENV"
            - name: Use Node.js ${{ matrix.config.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.config.node-version }}
                  cache: "npm"
            - run: yum install -y gcc-c++
            - run: ldd --version
            - run: npm ci --build-from-source
            - run: npm run package 2>&1
            - run: npm run tsc
            - run: npm run test
            - name: Upload release binary
              uses: alexellis/upload-assets@0.3.0
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              with:
                  asset_paths: '["./build/stage/jhulford/libxmljs/releases/download/**/*.tar.gz"]'

    upload-linux-arm64:
        strategy:
            fail-fast: false
            matrix:
                config:
                    - { node-version: 22, npm-version: 10 }
                    - { node-version: 24, npm-version: 11 }
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 1
            - uses: uraimo/run-on-arch-action@v2
              name: Build artifact
              id: build
              with:
                  arch: aarch64
                  distro: ubuntu_latest
                  githubToken: ${{ github.token }}

                  setup: |
                      mkdir -p "${PWD}/build"

                  dockerRunArgs: |
                      --volume "${PWD}/build:/build"
                      --volume "${PWD}:/app"
                      --workdir "/app"

                  shell: /bin/bash

                  install: |
                      apt update
                      apt install -y curl python3 build-essential git
                      curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash
                      source ~/.nvm/nvm.sh
                      nvm install v${{ matrix.config.node-version }}
                      npm install -g npm@${{ matrix.config.npm-version }}

                  run: |
                      source ~/.nvm/nvm.sh
                      npm config set progress false
                      npm i @mapbox/node-pre-gyp node-gyp -g
                      chown -R `whoami` ./
                      git config --global --add safe.directory '*'

                      npm install --build-from-source --unsafe-perm
                      node-pre-gyp package 2>&1
                      npm run tsc
                      npm run test

            - name: Upload release binary
              uses: alexellis/upload-assets@0.3.0
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              with:
                  asset_paths: '["./build/stage/jhulford/libxmljs/releases/download/**/*.tar.gz"]'
