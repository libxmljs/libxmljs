name: Test & Deploy

on:
    push:
        tags:
            - "*"
    workflow_dispatch:

jobs:
    build-and-upload:
        strategy:
            fail-fast: false
            matrix:
                # Build prebuilt binaries for Node 22 (LTS) and 24 (current) across platforms
                node-version: [22, 24]
                runner: [ubuntu-22.04, ubuntu-24.04-arm, macos-14]
        runs-on: ${{ matrix.runner }}
        steps:
            # Checkout with submodules to pull in vendored libxml2 source
            - uses: actions/checkout@v6
              with:
                  persist-credentials: false
                  submodules: true

            # Python is required by node-gyp to compile native C++ addons
            - uses: actions/setup-python@v6
              with:
                  python-version: "3.12"

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: "npm"

            # Install deps and compile native libxml2 bindings from source
            - run: npm ci --build-from-source

            # Package the compiled binary into a tarball for distribution via node-pre-gyp
            - run: npm run package 2>&1

            # Verify TypeScript compiles cleanly
            - run: npm run tsc

            # Run the full test suite (node:test via tsx)
            - run: npm run test

            # Upload the prebuilt binary tarball to the GitHub release
            - name: Upload release binary
              uses: alexellis/upload-assets@0.4.1
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              with:
                  asset_paths: '["./build/stage/jhulford/libxmljs/releases/download/**/*.tar.gz"]'
