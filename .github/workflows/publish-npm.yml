name: Publish to NPM

on:
    push:
        tags:
            - "*"
        branches:
            - master
    workflow_dispatch:

# Sets permissions for OIDC token to publish to npm
permissions:
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 1

            # Configure Node and the npm registry for publishing
            - uses: actions/setup-node@v6
              with:
                  node-version: 22
                  registry-url: https://registry.npmjs.org

            # Install deps (prebuilt binary is downloaded, no build-from-source needed)
            - run: npm install

            # Verify TypeScript compiles cleanly before publishing
            - run: npm run tsc

            # Run the full test suite as a final gate
            - run: npm run test

            # Publish to npm using OIDC token (no secrets needed)
            - run: npm publish --provenance
