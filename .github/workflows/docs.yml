jobs:
    build-docs:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  persist-credentials: false
                  submodules: true

            # Read version from package.json
            - name: Get package version
              id: package
              run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

            # Validate tag matches package version
            - name: Validate tag version
              run: |
                TAG_VERSION="${{ github.ref_name }}"
                PACKAGE_VERSION="${{ steps.package.outputs.version }}"
                echo "Tag version: $TAG_VERSION"
                echo "Package version: $PACKAGE_VERSION"
                if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
                  echo "❌ Error: Tag '$TAG_VERSION' does not match package version '$PACKAGE_VERSION'"
                  echo "❌ Tag must exactly match package version: '$PACKAGE_VERSION'"
                  exit 1
                fi
                echo "✅ Tag version matches package version"

            - name: Install
              run: npm install

            - name: Build Docs
              run: npm run docs

            - name: Add docs
              run: git add --force docs

            - name: Deploy to GH Pages
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: docs
